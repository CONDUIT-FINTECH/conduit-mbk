name: Conduit CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build (for example v1.2.3)
        required: true
        type: string
      publish_ghcr:
        description: Publish to GHCR only after registry access is configured and authorized
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag, main ancestry, configuration, and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release ref must be a semantic version tag such as v1.2.3"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} does not exist or does not point to a commit"
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::Checked-out commit does not match the requested release tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "::error::Release commit is not reachable from origin/main"
            exit 1
          fi

          test -f services/ml-service/Dockerfile
          test -f services/ml-service/requirements.txt
          test -f services/ml-service/src/main.py

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${TAG_COMMIT}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.completed_at // "")] | @tsv' \
            > "$RUNNER_TEMP/check-runs.tsv"

          python - "$RUNNER_TEMP/check-runs.tsv" <<'PY'
          import csv
          import sys

          required = {
              "Node.js Validation",
              "ML Python Tests",
              "Docker Compose Validation",
              "Build ML Service Image",
          }
          latest = {}
          with open(sys.argv[1], newline="", encoding="utf-8") as checks_file:
              for name, status, conclusion, completed_at in csv.reader(checks_file, delimiter="\t"):
                  if name in required:
                      current = latest.get(name)
                      if current is None or completed_at > current[0]:
                          latest[name] = (completed_at, status, conclusion)

          missing = required - latest.keys()
          failed = {
              name: result
              for name, result in latest.items()
              if result[1] != "completed" or result[2] != "success"
          }
          if missing or failed:
              if missing:
                  print("Missing successful CI checks: " + ", ".join(sorted(missing)), file=sys.stderr)
              if failed:
                  print(f"CI checks not successful: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("All required CI checks passed for the release commit.")
          PY

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

  build-and-scan:
    name: Build and Verify Release Image
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Build local ML service image
        env:
          COMMIT_SHA: ${{ needs.release-preflight.outputs.commit_sha }}
        run: |
          docker build --pull \
            --file services/ml-service/Dockerfile \
            --tag "conduit-ml-service:${COMMIT_SHA}" \
            services/ml-service

      - name: Verify image runtime configuration and record build metadata
        env:
          COMMIT_SHA: ${{ needs.release-preflight.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-preflight.outputs.release_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          image = f"conduit-ml-service:{os.environ['COMMIT_SHA']}"
          config = json.loads(subprocess.check_output(
              ["docker", "image", "inspect", image, "--format", "{{json .Config}}"],
              text=True,
          ))
          if config.get("User") != "conduit":
              raise SystemExit("Release image must run as non-root user 'conduit'")
          if "4008/tcp" not in config.get("ExposedPorts", {}):
              raise SystemExit("Release image must expose port 4008")
          if not any("/ready" in item for item in config.get("Healthcheck", {}).get("Test", [])):
              raise SystemExit("Release image must define the /ready health check")

          image_id = subprocess.check_output(
              ["docker", "image", "inspect", image, "--format", "{{.Id}}"],
              text=True,
          ).strip()
          with open("release-metadata.txt", "w", encoding="utf-8") as metadata:
              metadata.write(f"release_tag={os.environ['RELEASE_TAG']}\n")
              metadata.write(f"release_version={os.environ['RELEASE_VERSION']}\n")
              metadata.write(f"commit_sha={os.environ['COMMIT_SHA']}\n")
              metadata.write(f"built_at_utc={datetime.now(timezone.utc).isoformat()}\n")
              metadata.write(f"local_image_id={image_id}\n")
          PY

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: conduit-ml-service:${{ needs.release-preflight.outputs.commit_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.56.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conduit-ml-service:${{ needs.release-preflight.outputs.commit_sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.76.1

      - name: Archive release image for the authorized publisher
        if: success()
        env:
          COMMIT_SHA: ${{ needs.release-preflight.outputs.commit_sha }}
        run: docker save "conduit-ml-service:${COMMIT_SHA}" | gzip > ml-service-image.tar.gz

      - name: Upload build and security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ needs.release-preflight.outputs.release_tag }}
          path: |
            release-metadata.txt
            sbom.spdx.json
            trivy-results.json
            ml-service-image.tar.gz
          if-no-files-found: warn
          retention-days: 30

  publish-ghcr:
    name: Publish Approved Release to GHCR
    needs: [release-preflight, build-and-scan]
    if: >-
      vars.GHCR_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_ghcr == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-publish-${{ github.repository }}-${{ needs.release-preflight.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download verified release image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ needs.release-preflight.outputs.release_tag }}

      - name: Load and publish version and commit tags
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          COMMIT_SHA: ${{ needs.release-preflight.outputs.commit_sha }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/conduit-ml-service"
          SHA_TAG="sha-${COMMIT_SHA}"

          gzip -dc ml-service-image.tar.gz | docker load
          docker tag "conduit-ml-service:${COMMIT_SHA}" "${IMAGE}:${RELEASE_TAG}"
          docker tag "conduit-ml-service:${COMMIT_SHA}" "${IMAGE}:${SHA_TAG}"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin
          for tag in "$RELEASE_TAG" "$SHA_TAG"; do
            if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "::error::Refusing to overwrite existing release tag ${tag}"
              exit 1
            fi
          done
          docker push "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:${SHA_TAG}"
          docker logout ghcr.io

          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          SHA_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ -z "$DIGEST" || "$DIGEST" != "$SHA_DIGEST" ]]; then
            echo "::error::Version and commit tags do not resolve to the same image digest"
            exit 1
          fi

          {
            echo "image=${IMAGE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "registry_digest=${DIGEST}"
            echo "immutable_reference=${IMAGE}@${DIGEST}"
          } > published-image.txt

      - name: Preserve published image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-image-${{ needs.release-preflight.outputs.release_tag }}
          path: published-image.txt
          if-no-files-found: error
          retention-days: 90
