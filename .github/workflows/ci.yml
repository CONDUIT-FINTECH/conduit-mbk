name: Conduit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-validation:
    name: Node.js Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace dependency tree
        run: npm ls --workspaces --depth=0

      - name: Validate JavaScript package manifests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const tracked = execFileSync(
            'git',
            ['ls-files', 'packages/**/package.json', 'services/**/package.json'],
            { encoding: 'utf8' }
          ).trim().split(/\r?\n/).filter(Boolean);
          const files = ['package.json', ...tracked];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} package manifests`);
          NODE

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find packages services \
            -type f -name '*.js' \
            -not -path '*/node_modules/*' \
            -print0 |
            xargs -0 -r -n 1 node --check

  python-validation:
    name: ML Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/ml-service

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ml-service/requirements.txt
            services/ml-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Run Python tests and report coverage
        run: python -m pytest --cov=src --cov-report=term-missing

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify Compose services and ML build configuration
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          config = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"],
              text=True,
          ))
          services = config.get("services", {})
          expected = {"kafka", "redis", "postgres", "timescaledb", "mongodb", "ml-service"}
          missing = expected - services.keys()
          if missing:
              raise SystemExit(f"Compose services missing: {', '.join(sorted(missing))}")

          build = services["ml-service"].get("build", {})
          context = os.path.basename(build.get("context", "").rstrip("/\\"))
          if context != "ml-service" or build.get("dockerfile") != "Dockerfile":
              raise SystemExit("ML service must build from services/ml-service/Dockerfile")
          print("Compose service inventory and ML build configuration are valid")
          PY
